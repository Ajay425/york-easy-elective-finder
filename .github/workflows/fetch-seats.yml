name: Fetch Seats

on:
  schedule:
    # Runs at :23 every 4 hours (01:23, 05:23, 09:23, 13:23, 17:23, 21:23 UTC)
    - cron: '23 */4 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  fetch-seats:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend dependencies
        run: npm install
        working-directory: backend

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
        working-directory: backend

      - name: Random delay (0–20 min) to avoid predictable timing
        run: sleep $((RANDOM % 1200))

      - name: Fetch seat data
        env:
          YORK_USERNAME: ${{ secrets.YORK_USERNAME }}
          YORK_PASSWORD: ${{ secrets.YORK_PASSWORD }}
        run: node scripts/fetchSeats.js
        working-directory: backend

      - name: Commit and push if seats changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/yorku-elective-tracker/public/data/seats.json
          git diff --cached --quiet && echo "No changes to commit" || (git commit -m "chore: update seats.json [skip ci]" && git push)
